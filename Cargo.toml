[package]
name = "ipp2mqtt"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Driverless IPP Everywhere print server and status bridge for MQTT."
repository = "https://github.com/momentobooth/ipp2mqtt"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
config = { version = "0.15.25", default-features = false, features = ["toml"] }
env_logger = "0.11.11"
exponential-backoff = "2.1.1"
futures-util = { version = "0.3.34", default-features = false, features = ["io"] }
humantime = "2.4.0"
# Used as an IPP codec only; HTTP is ours so one connection is reused per printer.
ipp = { version = "7.0.0", default-features = false, features = ["async", "serde", "log"] }
log = "0.4.34"
mdns-sd = "0.21.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
snafu = "0.9.2"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.8"
