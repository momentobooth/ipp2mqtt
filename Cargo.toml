[package]
name = "ipp2mqtt"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Driverless IPP Everywhere print server and status bridge for MQTT."
repository = "https://github.com/momentobooth/ipp2mqtt"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
config = { version = "0.15.25", default-features = false, features = ["toml"] }
env_logger = "0.11.11"
humantime = "2.4.0"
log = "0.4.34"
mdns-sd = "0.21.3"
serde = { version = "1.0.229", features = ["derive"] }
snafu = "0.9.2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.8"
